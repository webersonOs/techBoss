<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Locação de Equipamentos</title>
  <!-- Bootstrap 5 CDN para estilização base -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ======================================================== -->
  <!-- TELA DE LOGIN / CADASTRO                                 -->
  <!-- ======================================================== -->
  <div id="telaLogin">
    <div class="card p-4 shadow" style="width: 100%; max-width: 450px; border-radius: 12px;">
      <div class="d-flex mb-3 border-bottom">
        <button id="abaIrParaLogin" class="btn w-50 aba-autenticacao ativa fw-bold border-0 rounded-0 py-2">Entrar</button>
        <button id="abaIrParaCadastro" class="btn w-50 aba-autenticacao text-muted fw-bold border-0 rounded-0 py-2">Cadastrar-se</button>
      </div>

      <!-- Formulário de Login -->
      <form id="formLogin">
        <div class="mb-3">
          <label for="loginEmail" class="form-label">E-mail</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="seu@email.com" required>
        </div>
        <div class="mb-3">
          <label for="loginSenha" class="form-label">Senha</label>
          <input type="password" id="loginSenha" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Entrar no Sistema</button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="formCadastro" class="d-none">
        <div class="mb-3">
          <label for="cadNome" class="form-label">Nome Completo</label>
          <input type="text" id="cadNome" class="form-control" placeholder="João Silva" required>
        </div>
        <div class="mb-3">
          <label for="cadEmail" class="form-label">E-mail de Acesso</label>
          <input type="email" id="cadEmail" class="form-control" placeholder="nome@provedor.com" required>
        </div>
        <div class="mb-3">
          <label for="cadSenha" class="form-label">Crie uma Senha</label>
          <input type="password" id="cadSenha" class="form-control" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Criar Minha Conta</button>
      </form>
    </div>
  </div>

  <!-- ======================================================== -->
  <!-- CONTEÚDO PRINCIPAL DO SITE                               -->
  <!-- ======================================================== -->
  <div id="conteudoSite">
    
    <!-- Barra de Navegação Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
      <div class="container-fluid">
        <span class="navbar-brand fw-bold text-warning">🛠️ TechBoss</span>
        <div class="d-flex align-items-center gap-3">
          <button id="toggleTheme" class="btn btn-sm btn-outline-light">🌙 Modo Escuro</button>
          <span id="nomeUsuarioNav" class="text-white fw-semibold">Olá, Usuário</span>
          <button id="btnLogout" class="btn btn-sm btn-danger fw-bold">Sair</button>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      
      <!-- Painel do Gerente (Apenas visível se logar com luiz@02) -->
      <div id="painelAdminDashboard" style="display: none;" class="mb-5"></div>

      <!-- Interface Principal do Cliente -->
      <div id="visaoClienteContainer">
        <div class="row">
          
          <!-- Formulário Lateral para Adicionar Itens -->
          <div class="col-lg-4 mb-4">
            <div class="card p-4 shadow-sm border bg-light">
              <h3 class="mb-3 text-dark custom-card-title">📅 Reservar Equipamento</h3>
              <form id="formReserva">
                <div class="mb-3">
                  <label for="nome" class="form-label">Seu Nome</label>
                  <input type="text" id="nome" class="form-control" readonly>
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Seu E-mail</label>
                  <input type="email" id="email" class="form-control" readonly>
                </div>
                <div class="mb-3">
                  <label for="equipamento" class="form-label">Escolha o Equipamento</label>
                  <select id="equipamento" class="form-select" required>
                    <option value="" disabled selected>Selecione um item...</option>
                    <option value="computador" data-preco="150.00">Computador Gamer - R$ 150/dia</option>
                    <option value="camera" data-preco="120.00">Câmera DSLR Profissional - R$ 120/dia</option>
                    <option value="projetor" data-preco="90.00">Projetor HD Corporativo - R$ 90/dia</option>
                    <option value="notebook" data-preco="100.00">Notebook Corporativo - R$ 100/dia</option>
                    <option value="iluminacao" data-preco="70.00">Kit Iluminação Estúdio - R$ 70/dia</option>
                    <option value="tablet" data-preco="80.00">Tablet Pro com Caneta - R$ 80/dia</option>
                  </select>
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label for="dataRetirada" class="form-label">Data Retirada</label>
                    <input type="date" id="dataRetirada" class="form-control" required>
                  </div>
                  <div class="col-md-6 mb-3">
                    <label for="dataDevolucao" class="form-label">Data Devolução</label>
                    <input type="date" id="dataDevolucao" class="form-control" disabled required>
                  </div>
                </div>

                <!-- Resumo dinâmico de preços da diária corrente -->
                <div id="resumoPreco" class="alert alert-info text-center p-2 mb-3 d-none"></div>

                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">🛒 Colocar no Carrinho</button>
              </form>
            </div>
          </div>

          <!-- Catálogo de Produtos com Filtros -->
          <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
              <div class="btn-group shadow-sm" role="group">
                <button type="button" class="btn btn-outline-primary btn-filtro active" data-categoria="todos">Todos</button>
                <button type="button" class="btn btn-outline-primary btn-filtro" data-categoria="computadores">Computadores</button>
                <button type="button" class="btn btn-outline-primary btn-filtro" data-categoria="foto-video">Foto & Vídeo</button>
                <button type="button" class="btn btn-outline-primary btn-filtro" data-categoria="outros">Outros</button>
              </div>
              <input type="text" id="inputBusca" class="form-control" placeholder="Buscar equipamento..." style="max-width: 280px;">
            </div>

            <!-- Container Grid dos Equipamentos -->
            <div id="containerProdutos" class="row"></div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- ======================================================== -->
  <!-- SISTEMA DE CARRINHO FLUTUANTE / LATERAL                  -->
  <!-- ======================================================== -->
  
  <!-- Botão Flutuante do Carrinho -->
  <button id="btnVerCarrinho" onclick="abrirFecharCarrinho()" class="btn btn-warning shadow-lg rounded-pill fw-bold">
    🛒 Ver Carrinho (<span id="carrinhoContador">0</span>)
  </button>

  <!-- Janela Retrátil Lateral do Carrinho -->
  <div id="janelaCarrinho" class="shadow-lg p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="text-dark custom-card-title mb-0">Seu Carrinho</h3>
      <button class="btn btn-sm btn-secondary" onclick="abrirFecharCarrinho()">Fechar ✕</button>
    </div>
    
    <!-- Lista de Produtos Adicionados -->
    <ul id="listaItensCarrinho" class="list-group mb-3"></ul>

    <!-- Resumo de Valores -->
    <div class="fs-4 fw-bold text-dark custom-card-title mb-4 border-top pt-3">
      Total: <span class="text-primary" id="carrinhoTotal">R$ 0,00</span>
    </div>

    <!-- Seção de Formas de Pagamento Dinâmicas -->
    <div class="mb-4">
      <h5 class="text-dark custom-card-title mb-3">Forma de Pagamento</h5>
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="carrinhoPagamento" id="payPix" value="Pix" checked onchange="alternarCamposPagamento()">
        <label class="form-check-label text-dark" for="payPix">Pix (5% de Desconto)</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="carrinhoPagamento" id="payCartao" value="Cartão" onchange="alternarCamposPagamento()">
        <label class="form-check-label text-dark" for="payCartao">Cartão de Crédito</label>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="radio" name="carrinhoPagamento" id="payBoleto" value="Boleto" onchange="alternarCamposPagamento()">
        <label class="form-check-label text-dark" for="payBoleto">Boleto Bancário</label>
      </div>

      <!-- Painel Dinâmico: Pix -->
      <div id="camposPix" class="alert alert-success p-2 small border" style="display: block;">
        ✨ Desconto aplicado! O QR Code copia e cola será exibido ao finalizar.
      </div>

      <!-- Painel Dinâmico: Cartão de Crédito -->
      <div id="camposCartao" class="p-3 bg-light rounded border mb-2" style="display: none;">
        <input type="text" class="form-control form-control-sm mb-2" placeholder="Número do Cartão (0000 0000 0000 0000)">
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" placeholder="MM/AA" style="width: 50%;">
          <input type="text" class="form-control form-control-sm" placeholder="CVV" style="width: 50%;">
        </div>
      </div>

      <!-- Painel Dinâmico: Boleto -->
      <div id="camposBoleto" class="alert alert-secondary p-2 small border text-dark" style="display: none;">
        📑 O boleto bancário será gerado com vencimento para daqui a 3 dias úteis.
      </div>
    </div>

    <!-- Botão de Encerramento do Pedido -->
    <button onclick="finalizarCarrinho()" class="btn btn-success w-100 py-2.5 fw-bold fs-5 shadow">Finalizar Locação</button>
  </div>

  <!-- Sombra de Fundo do Carrinho -->
  <div id="carrinhoOverlay" onclick="abrirFecharCarrinho()"></div>

  <!-- JavaScript do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript do Sistema -->
  <script src="script.js"></script>
</body>
</html>
